<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F1 Chat</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; }
    #log > div { margin: 12px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e8f0fe; } .bot { background: #f3f3f3; } .err { background: #fde8e8; }
    details pre { overflow-x: auto; background: #222; color: #eee; padding: 8px; border-radius: 6px; }
    form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; }
    #tools { display: flex; gap: 16px; align-items: center; margin: 8px 0; } #tools input { flex: none; }
    #status { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>F1 Chat <small>(2024 laps &amp; results)</small></h1>
  <div id="status">Loading data...</div>
  <div id="tools"><label><input type="checkbox" id="notes" /> Use exploration notes</label>
    <button id="explore" disabled>Explore schema</button></div>
  <div id="log"></div>
  <form id="form"><input id="q" placeholder="Ask about 2024 F1..." autocomplete="off" disabled /><button disabled>Ask</button></form>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
